<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Luna</title>
<style>
:root { --bg:#fff; --card:#f7f7f5; --text:#37352f; --muted:#787774; --line:#e9e9e7; --moondark:#3a3a3a; --acc:#2e7d4f; }
@media (prefers-color-scheme: dark) { :root { --bg:#191919; --card:#232323; --text:#e8e7e4; --muted:#9b9a97; --line:#303030; --moondark:#0f0f0f; --acc:#6fbf8e; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.4 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { padding: 12px; display: grid; gap: 12px; max-width: 420px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 16px; }
.top svg { width: 96px; height: 96px; flex: none; }
.name { font: 600 22px/1.15 Georgia, "Iowan Old Style", "Palatino Linotype", serif; }
.sub { color: var(--muted); font-size: 13px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.sign { margin-top: 6px; font-size: 15px; }
.sign span { font-size: 19px; vertical-align: -1px; }
.next { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.box { background: var(--card); border-radius: 12px; padding: 10px 12px; }
.box.soon { outline: 2px solid var(--acc); outline-offset: -2px; }
.box .k { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.box .k svg { width: 16px; height: 16px; }
.box .n { font: 600 30px/1.1 Georgia, "Iowan Old Style", serif; margin-top: 4px; }
.box .n small { font: 13px ui-sans-serif, system-ui, sans-serif; color: var(--muted); margin-left: 4px; }
.box .d { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <svg viewBox="-34 -34 68 68" role="img" id="msvg">
      <defs><radialGradient id="g" cx="-0.25" cy="-0.25" r="1.1"><stop offset="0" stop-color="#fff7dc"/><stop offset="1" stop-color="#e6d6a3"/></radialGradient></defs>
      <circle r="30" fill="var(--moondark)"/>
      <path id="lit" fill="url(#g)"/>
      <circle r="30" fill="none" stroke="var(--line)"/>
    </svg>
    <div>
      <div class="name" id="mname"></div>
      <div class="sub" id="mill"></div>
      <div class="sign" id="msign"></div>
    </div>
  </div>
  <div class="next">
    <div class="box" id="bfull"><div class="k"><svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="10" fill="#f3e9c6" stroke="var(--line)"/></svg>Luna llena</div><div class="n" id="nfull"></div><div class="d" id="dfull"></div></div>
    <div class="box" id="bnew"><div class="k"><svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="10" fill="var(--moondark)" stroke="var(--muted)"/></svg>Luna nueva</div><div class="n" id="nnew"></div><div class="d" id="dnew"></div></div>
  </div>
</div>
<script>
// Luna y Sol de baja precisión (Meeus, caps. 25 y 47 truncados). Error típico < 0,05°.
const Moon = (function () {
  const D2R = Math.PI / 180, norm = x => ((x % 360) + 360) % 360;
  const s = x => Math.sin(x * D2R);
  const T = date => (date.getTime() / 86400000 + 2440587.5 - 2451545.0) / 36525;
  function sunLon(t) {
    const L0 = 280.46646 + 36000.76983 * t, M = 357.52911 + 35999.05029 * t;
    const C = (1.914602 - 0.004817 * t) * s(M) + (0.019993 - 0.000101 * t) * s(2 * M) + 0.000289 * s(3 * M);
    const om = 125.04 - 1934.136 * t;
    return norm(L0 + C - 0.00569 - 0.00478 * s(om));
  }
  // [D, M, M', F, coef(1e-6 °)]
  const TERMS = [
    [0,0,1,0,6288774],[2,0,-1,0,1274027],[2,0,0,0,658314],[0,0,2,0,213618],[0,1,0,0,-185116],[0,0,0,2,-114332],
    [2,0,-2,0,58793],[2,-1,-1,0,57066],[2,0,1,0,53322],[2,-1,0,0,45758],[0,1,-1,0,-40923],[1,0,0,0,-34720],
    [0,1,1,0,-30383],[2,0,0,-2,15327],[0,0,1,2,-12528],[0,0,1,-2,10980],[4,0,-1,0,10675],[0,0,3,0,10034],
    [4,0,-2,0,8548],[2,1,-1,0,-7888],[2,1,0,0,-6766],[1,0,-1,0,-5163],[1,1,0,0,4987],[2,-1,1,0,4036],
    [2,0,2,0,3994],[4,0,0,0,3861],[2,0,-3,0,3665],[0,1,-2,0,-2689],[2,0,-1,2,-2602],[2,-1,-2,0,2390],
    [1,0,1,0,-2348],[2,-2,0,0,2236],[0,1,2,0,-2120],[0,2,0,0,-2069],[2,-2,-1,0,2048],[2,0,1,-2,-1773],
    [2,0,0,2,-1595],[4,-1,-1,0,1215],[0,0,2,2,-1110],[3,0,-1,0,-892],[2,1,1,0,-810],[4,-1,-2,0,759],
    [0,2,-1,0,-713],[2,2,-1,0,-700],[2,1,-2,0,691],[2,-1,0,-2,596],[4,0,1,0,549],[0,0,4,0,537]
  ];
  function moonLon(t) {
    const Lp = 218.3164477 + 481267.88123421 * t, D = 297.8501921 + 445267.1114034 * t;
    const M = 357.5291092 + 35999.0502909 * t, Mp = 134.9633964 + 477198.8675055 * t, F = 93.2720950 + 483202.0175233 * t;
    const E = 1 - 0.002516 * t - 0.0000074 * t * t;
    let sum = 0;
    for (const [d, m, mp, f, c] of TERMS) {
      const e = Math.abs(m) === 1 ? E : Math.abs(m) === 2 ? E * E : 1;
      sum += c * e * s(d * D + m * M + mp * Mp + f * F);
    }
    const A1 = 119.75 + 131.849 * t, A2 = 53.09 + 479264.290 * t;
    sum += 3958 * s(A1) + 1962 * s(Lp - F) + 318 * s(A2);
    const om = 125.04 - 1934.136 * t;
    return norm(Lp + sum / 1e6 - 0.00478 * s(om));
  }
  const elong = date => { const t = T(date); return norm(moonLon(t) - sunLon(t)); };
  function state(date) {
    const t = T(date), lm = moonLon(t), e = norm(lm - sunLon(t));
    const illum = (1 - Math.cos(e * D2R)) / 2;
    return { e, illum, lon: lm, waxing: e < 180 };
  }
  // Próximo instante en que la elongación vale target (0 = nueva, 180 = llena)
  function next(date, target) {
    const f = d => ((elong(d) - target + 540) % 360) - 180;
    let a = new Date(date.getTime()), fa = f(a);
    for (let i = 0; i < 32 * 4; i++) {
      const b = new Date(a.getTime() + 6 * 3600000), fb = f(b);
      if (fa < 0 && fb >= 0) {
        let lo = a, hi = b;
        for (let k = 0; k < 30; k++) { const mid = new Date((lo.getTime() + hi.getTime()) / 2); if (f(mid) < 0) lo = mid; else hi = mid; }
        return hi;
      }
      a = b; fa = fb;
    }
    return null;
  }
  // Mismos cortes que el widget de la Luna de la carta: las fases exactas ocupan ±6°
  const phaseName = p => p < 6 || p >= 354 ? 'Luna nueva' : p < 84 ? 'Luna creciente' : p < 96 ? 'Cuarto creciente' : p < 174 ? 'Gibosa creciente'
    : p < 186 ? 'Luna llena' : p < 264 ? 'Gibosa menguante' : p < 276 ? 'Cuarto menguante' : 'Luna menguante';
  const SIGNS = ['Aries', 'Tauro', 'Géminis', 'Cáncer', 'Leo', 'Virgo', 'Libra', 'Escorpio', 'Sagitario', 'Capricornio', 'Acuario', 'Piscis'];
  const GLYPHS = ['♈', '♉', '♊', '♋', '♌', '♍', '♎', '♏', '♐', '♑', '♒', '♓'];
  const sign = lon => ({ name: SIGNS[Math.floor(lon / 30)], glyph: GLYPHS[Math.floor(lon / 30)] + '︎', deg: Math.floor(lon % 30) });
  return { state, next, phaseName, sign, moonLon, sunLon, T };
})();
</script>
<script>
function moonPath(e) {
  const r = 30, waxing = e < 180, q = waxing ? e : 360 - e, rx = r * Math.abs(Math.cos(q * Math.PI / 180)), cres = q < 90;
  return waxing
    ? `M0 ${-r} A${r} ${r} 0 0 1 0 ${r} A${rx} ${r} 0 0 ${cres ? 0 : 1} 0 ${-r}Z`
    : `M0 ${-r} A${r} ${r} 0 0 0 0 ${r} A${rx} ${r} 0 0 ${cres ? 1 : 0} 0 ${-r}Z`;
}
const $ = id => document.getElementById(id);
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const dfmt = d => d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
function setNext(prefix, date, now) {
  const days = Math.round((dayStart(date) - dayStart(now)) / 86400000);
  const n = $('n' + prefix);
  if (days === 0) n.textContent = 'Hoy'; else if (days === 1) n.textContent = 'Mañana'; else n.replaceChildren(String(days), Object.assign(document.createElement('small'), { textContent: 'días' }));
  $('d' + prefix).textContent = dfmt(date).replace(/^./, c => c.toUpperCase()) + ' · ' + date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  return days;
}
function tick() {
  const now = new Date(), st = Moon.state(now), sg = Moon.sign(st.lon);
  $('lit').setAttribute('d', moonPath(st.e));
  $('mname').textContent = Moon.phaseName(st.e);
  $('msvg').setAttribute('aria-label', Moon.phaseName(st.e));
  $('mill').textContent = 'Iluminada ' + Math.round(st.illum * 100) + ' % · ' + (st.waxing ? 'creciendo' : 'menguando');
  const sp = document.createElement('span'); sp.textContent = sg.glyph;
  $('msign').replaceChildren('Luna en ', Object.assign(document.createElement('b'), { textContent: sg.name }), ' ', sp, ' ' + sg.deg + '°');
  const full = Moon.next(now, 180), nw = Moon.next(now, 0);
  const df = setNext('full', full, now), dn = setNext('new', nw, now);
  $('bfull').classList.toggle('soon', df <= dn); $('bnew').classList.toggle('soon', dn < df);
}
tick(); setInterval(tick, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
