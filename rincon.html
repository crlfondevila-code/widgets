<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rincón</title>
<style>
:root { --bg:#fff; --card:#f7f7f5; --text:#37352f; --muted:#787774; --line:#e9e9e7; --on:#37352f; --onText:#fff; }
@media (prefers-color-scheme: dark) { :root { --bg:#191919; --card:#232323; --text:#e8e7e4; --muted:#9b9a97; --line:#303030; --on:#e8e7e4; --onText:#191919; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { padding: 12px; display: grid; gap: 10px; }
.quote { background: var(--card); border-radius: 12px; padding: 12px 14px; position: relative; }
.quote q { display: block; font: italic 16px/1.45 Georgia, "Iowan Old Style", "Palatino Linotype", serif; quotes: "«" "»"; padding-right: 26px; }
.quote .who { margin-top: 6px; font-size: 12px; color: var(--muted); }
.again { position: absolute; top: 8px; right: 8px; border: 0; background: none; color: var(--muted); font-size: 16px; cursor: pointer; border-radius: 6px; width: 28px; height: 28px; }
.again:hover { background: var(--line); }
.sounds { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.pill { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 4px 9px; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.grp { font-size: 12px; color: var(--muted); margin-left: 4px; }
.pill.on { background: var(--on); color: var(--onText); border-color: var(--on); }
.vol { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-left: auto; }
.vol input { width: 90px; accent-color: var(--muted); }
.catbox { position: relative; border-top: 1px dashed var(--line); padding-top: 4px; }
canvas { display: block; width: 100%; height: 64px; image-rendering: pixelated; cursor: pointer; }
.cathint { position: absolute; right: 2px; top: 6px; font-size: 11px; color: var(--muted); pointer-events: none; transition: opacity .6s; }
.cathint.gone { opacity: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="quote">
    <q id="q"></q>
    <div class="who" id="who"></div>
    <button class="again" id="again" type="button" title="Otra frase" aria-label="Otra frase">↻</button>
  </div>
  <div class="sounds" id="sounds">
    <div class="vol"><span>🔈</span><input id="vol" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Volumen"></div>
  </div>
  <div class="catbox">
    <canvas id="cat" height="64" aria-label="Dos gatos pixelados, uno naranja y uno negro. Tócalos."></canvas>
    <div class="cathint" id="cathint">tócalos</div>
  </div>
</div>
<script>
// ---------- Frase del día (traducciones propias de textos clásicos) ----------
const QUOTES = [
  ['Nadie se baña dos veces en el mismo río.', 'Heráclito'],
  ['El carácter de cada uno es su destino.', 'Heráclito'],
  ['Un viaje de mil li empieza bajo tus pies.', 'Laozi, Tao Te King 64'],
  ['Quien conoce a los demás es sabio; quien se conoce a sí mismo, lúcido.', 'Laozi, Tao Te King 33'],
  ['Quien sabe cuándo tiene bastante, es rico.', 'Laozi, Tao Te King 33'],
  ['La bondad más alta es como el agua: favorece a todo y no compite con nada.', 'Laozi, Tao Te King 8'],
  ['Treinta radios comparten un cubo: el vacío del centro hace útil la rueda.', 'Laozi, Tao Te King 11'],
  ['Nada hay más blando que el agua, y nada la supera para vencer lo duro.', 'Laozi, Tao Te King 78'],
  ['¿Soñaba Zhuang Zhou que era una mariposa, o sueña la mariposa que es Zhuang Zhou?', 'Zhuangzi'],
  ['Tratar la enfermedad cuando ya ha aparecido es como cavar un pozo cuando ya se tiene sed.', 'Huangdi Neijing, Suwen 2'],
  ['Saber que sabes lo que sabes y que no sabes lo que no sabes: eso es saber.', 'Confucio, Analectas II, 17'],
  ['Lo que no quieras para ti, no lo hagas a los demás.', 'Confucio, Analectas XV, 24'],
  ['Mientras la vamos aplazando, la vida pasa.', 'Séneca, Cartas a Lucilio 1'],
  ['No es que tengamos poco tiempo: es que perdemos mucho.', 'Séneca, Sobre la brevedad de la vida'],
  ['Enseñando, aprendemos.', 'Séneca, Cartas a Lucilio 7'],
  ['El universo es cambio; la vida, opinión.', 'Marco Aurelio, Meditaciones IV, 3'],
  ['El alma se tiñe del color de sus pensamientos.', 'Marco Aurelio, Meditaciones V, 16'],
  ['No nos inquietan las cosas, sino lo que pensamos de ellas.', 'Epicteto, Enquiridión 5'],
  ['Cada hombre lleva en sí la forma entera de la condición humana.', 'Montaigne, Ensayos III, 2'],
  ['Mi oficio y mi arte es vivir.', 'Montaigne, Ensayos II, 6'],
  ['La mente no es un vaso que llenar, sino una leña que encender.', 'Plutarco, Sobre cómo escuchar'],
  ['Una vida sin examen no merece ser vivida.', 'Sócrates, en la Apología de Platón'],
  ['La vida es breve; el arte, largo.', 'Hipócrates, Aforismos I, 1'],
  ['Huye entretanto, huye el tiempo irreparable.', 'Virgilio, Geórgicas III'],
  ['Aprovecha el día y fíate lo menos posible del mañana.', 'Horacio, Odas I, 11'],
  ['Conócete a ti mismo.', 'Inscripción del templo de Delfos'],
  ['Caminante, no hay camino: se hace camino al andar.', 'Antonio Machado']
];
const dayIdx = () => { const n = new Date(), s = new Date(n.getFullYear(), 0, 0); return Math.floor((n - s) / 86400000); };
let qi = dayIdx() % QUOTES.length;
function showQuote() { document.getElementById('q').textContent = QUOTES[qi][0]; document.getElementById('who').textContent = '— ' + QUOTES[qi][1]; }
document.getElementById('again').onclick = () => { qi = (qi + 1 + Math.floor(Math.random() * (QUOTES.length - 1))) % QUOTES.length; showQuote(); };
showQuote();

// ---------- Sonidos de ambiente (sintetizados, sin archivos) ----------
let ctx = null, master = null, noiseW = null, noiseB = null, noiseW8 = null, noiseP = null, noiseR = null;
const tracks = {};
const rnd = n => Math.floor(Math.random() * n);
// Ruido largo (8 s) que empieza y acaba en el mismo punto, para que el bucle no haga «clic»
function longNoise(kind) {
  const len = ctx.sampleRate * 8, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    if (kind === 'blanco') d[i] = w;
    else if (kind === 'rosa') {   // filtro de Paul Kellet
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
      b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
      d[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362; b6 = w * 0.115926;
    } else { last = (last + 0.02 * w) / 1.02; d[i] = last; }   // marrón
  }
  const drift = d[len - 1] - d[0];
  let peak = 0, mean = 0;
  for (let i = 0; i < len; i++) { d[i] -= drift * i / (len - 1); mean += d[i]; }
  mean /= len;
  for (let i = 0; i < len; i++) { d[i] -= mean; peak = Math.max(peak, Math.abs(d[i])); }
  for (let i = 0; i < len; i++) d[i] *= 0.9 / peak;
  return buf;
}
function audio() {
  if (ctx) return ctx;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = +document.getElementById('vol').value;
  const limit = ctx.createDynamicsCompressor();   // si suenan muchos a la vez, que no sature
  limit.threshold.value = -6; limit.knee.value = 6; limit.ratio.value = 12; limit.attack.value = 0.003; limit.release.value = 0.25;
  master.connect(limit); limit.connect(ctx.destination);
  const len = ctx.sampleRate * 4;
  noiseW = ctx.createBuffer(1, len, ctx.sampleRate); const w = noiseW.getChannelData(0);
  for (let i = 0; i < len; i++) w[i] = Math.random() * 2 - 1;
  noiseB = ctx.createBuffer(1, len, ctx.sampleRate); const b = noiseB.getChannelData(0); let last = 0;
  for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; b[i] = last * 3.5; }
  noiseW8 = longNoise('blanco'); noiseP = longNoise('rosa'); noiseR = longNoise('marron');
  return ctx;
}
function src(buf) { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.loopStart = Math.random(); s.start(0, Math.random() * 3); return s; }
function loopSrc(buf) { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0, Math.random() * 7); return s; }
function panner(v) { if (!ctx.createStereoPanner) return ctx.createGain(); const p = ctx.createStereoPanner(); p.pan.value = v; return p; }
function lfo(freq, depth, target, offset) {
  const o = ctx.createOscillator(); o.frequency.value = freq; const g = ctx.createGain(); g.gain.value = depth;
  o.connect(g); g.connect(target); if (offset != null) target.value = offset; o.start(); return o;
}
const MAKERS = {
  lluvia() {
    const out = ctx.createGain(); out.gain.value = 0.55;
    const s = src(noiseW), hp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 500; lp.type = 'lowpass'; lp.frequency.value = 7000;
    s.connect(hp); hp.connect(lp); lp.connect(out);
    const drops = setInterval(() => {         // gotas sueltas
      if (Math.random() < 0.6) return;
      const t = ctx.currentTime, g = ctx.createGain(), bp = ctx.createBiquadFilter(), n = ctx.createBufferSource();
      n.buffer = noiseW; bp.type = 'bandpass'; bp.frequency.value = 1800 + Math.random() * 3000; bp.Q.value = 6;
      g.gain.setValueAtTime(0.25 * Math.random(), t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      n.connect(bp); bp.connect(g); g.connect(out); n.start(t, Math.random() * 3, 0.06);
    }, 45);
    return { out, stop() { clearInterval(drops); s.stop(); } };
  },
  mar() {
    const out = ctx.createGain(), s = src(noiseB), lp = ctx.createBiquadFilter(), amp = ctx.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 700; amp.gain.value = 0.55;
    const o1 = lfo(0.09, 0.45, amp.gain), o2 = lfo(0.09, 450, lp.frequency);
    s.connect(lp); lp.connect(amp); amp.connect(out); out.gain.value = 0.9;
    return { out, stop() { s.stop(); o1.stop(); o2.stop(); } };
  },
  viento() {
    const out = ctx.createGain(), s = src(noiseW), bp = ctx.createBiquadFilter(), amp = ctx.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 1.4; amp.gain.value = 0.35;
    const o1 = lfo(0.13, 260, bp.frequency), o2 = lfo(0.07, 0.25, amp.gain);
    s.connect(bp); bp.connect(amp); amp.connect(out); out.gain.value = 0.8;
    return { out, stop() { s.stop(); o1.stop(); o2.stop(); } };
  },
  fuego() {
    const out = ctx.createGain(); out.gain.value = 0.8;
    const s = src(noiseB), lp = ctx.createBiquadFilter(), rum = ctx.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 180; rum.gain.value = 0.6; s.connect(lp); lp.connect(rum); rum.connect(out);
    const crackle = setInterval(() => {       // chasquidos
      const k = Math.random(); if (k < 0.55) return;
      const t = ctx.currentTime + Math.random() * 0.05, g = ctx.createGain(), hp = ctx.createBiquadFilter(), n = ctx.createBufferSource();
      n.buffer = noiseW; hp.type = 'highpass'; hp.frequency.value = 1200 + Math.random() * 2500;
      const v = k > 0.97 ? 0.9 : 0.15 + Math.random() * 0.3, dur = 0.01 + Math.random() * 0.04;
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      n.connect(hp); hp.connect(g); g.connect(out); n.start(t, Math.random() * 3, dur + 0.02);
    }, 60);
    return { out, stop() { clearInterval(crackle); s.stop(); } };
  },
  truenos() {   // tormenta a lo lejos (y alguna cerca), cada 8–25 s; combina bien con la lluvia
    const out = ctx.createGain(); out.gain.value = 1.7;
    let timer;
    const boom = () => {
      const t = ctx.currentTime + 0.05, near = Math.random() < 0.3, peak = near ? 1 : 0.5 + Math.random() * 0.3;
      const n = ctx.createBufferSource(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
      n.buffer = noiseR; n.loop = true; lp.type = 'lowpass'; lp.Q.value = 0.7;
      lp.frequency.setValueAtTime(near ? 2200 : 800, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + (near ? 0.06 : 0.5 + Math.random() * 0.6));
      let tt = t + (near ? 0.06 : 0.8);
      const rolls = 2 + rnd(4);   // el retumbar: sube y baja varias veces
      for (let i = 0; i < rolls; i++) {
        tt += 0.3 + Math.random() * 0.9; g.gain.exponentialRampToValueAtTime(peak * (0.2 + Math.random() * 0.35), tt);
        tt += 0.25 + Math.random() * 0.6; g.gain.exponentialRampToValueAtTime(peak * (0.45 + Math.random() * 0.45) * Math.pow(0.8, i), tt);
      }
      const end = tt + 2.5 + Math.random() * 3;
      lp.frequency.exponentialRampToValueAtTime(160, end);
      g.gain.exponentialRampToValueAtTime(0.0001, end);
      n.connect(lp); lp.connect(g); g.connect(out); n.start(t, Math.random() * 7); n.stop(end + 0.1);
      if (near) {   // el chasquido del rayo cercano
        const c = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), cg = ctx.createGain();
        c.buffer = noiseW8; hp.type = 'highpass'; hp.frequency.value = 600;
        cg.gain.setValueAtTime(0.35, t); cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        c.connect(hp); hp.connect(cg); cg.connect(out); c.start(t, Math.random() * 7, 0.4);
      }
      timer = setTimeout(boom, 8000 + Math.random() * 17000);
    };
    timer = setTimeout(boom, 600);
    return { out, stop() { clearTimeout(timer); } };
  },
  pajaros() {   // tres pájaros, cada uno con su canto, a distinta distancia y lado
    const out = ctx.createGain(); out.gain.value = 0.9;
    const leaves = loopSrc(noiseP), bp = ctx.createBiquadFilter(), lg = ctx.createGain();   // un fondo de hojas muy suave
    bp.type = 'bandpass'; bp.frequency.value = 3000; bp.Q.value = 0.4; lg.gain.value = 0.025;
    leaves.connect(bp); bp.connect(lg); lg.connect(out);
    const SONGS = [
      b => { const n = 2 + rnd(4), gap = 0.13 + Math.random() * 0.06; return Array.from({ length: n }, (_, i) => [i * gap, 0.07, b, b * 1.6, 1]); },            // «tui-tui-tui»
      b => [[0, 0.32, b * 1.2, b * 0.8, 0.8], [0.42, 0.24, b * 1.05, b * 0.72, 0.6]],                                                                          // silbido que baja
      b => { const n = 8 + rnd(10); return Array.from({ length: n }, (_, i) => [i * 0.045, 0.03, b * 1.45, b * 1.2, 0.6]); },                                  // trino
      b => { const n = 1 + rnd(3); return Array.from({ length: n }, (_, i) => [i * 0.09, 0.025, b * 1.7, b * 1.4, 0.8]); },                                    // «chip»
      b => { const n = 2 + rnd(3), out = []; for (let i = 0; i < n; i++) { out.push([i * 0.34, 0.1, b * 1.3, b * 1.24, 0.9], [i * 0.34 + 0.13, 0.12, b * 0.95, b * 0.97, 0.8]); } return out; }   // «chi-pa, chi-pa»
    ];
    const birds = [0, 1, 2].map(i => ({ song: SONGS[rnd(SONGS.length)], base: 2600 + Math.random() * 1400, pan: [-0.6, 0.1, 0.7][i] + Math.random() * 0.2 - 0.1, vol: 0.35 + Math.random() * 0.35 }));
    let timer;
    const sing = () => {
      const bird = birds[rnd(birds.length)], t0 = ctx.currentTime + 0.05, p = panner(bird.pan);
      p.connect(out);
      let last = 0;
      for (const [dt, dur, f0, f1, v] of bird.song(bird.base)) {
        const o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + dt;
        o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v * bird.vol, t + Math.min(0.012, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(p); o.start(t); o.stop(t + dur + 0.02); last = Math.max(last, dt + dur);
      }
      setTimeout(() => p.disconnect(), (last + 0.5) * 1000);
      timer = setTimeout(sing, 700 + Math.random() * 2600);
    };
    timer = setTimeout(sing, 300);
    return { out, stop() { clearTimeout(timer); leaves.stop(); } };
  },
  grillos() {   // noche de verano: tres grillos con su ritmo, sobre un fondo muy bajo
    const out = ctx.createGain(); out.gain.value = 0.8;
    const night = loopSrc(noiseR), lp = ctx.createBiquadFilter(), ng = ctx.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 400; ng.gain.value = 0.05; night.connect(lp); lp.connect(ng); ng.connect(out);
    const crickets = [-0.55, 0.15, 0.65].map(pan => {
      const o = ctx.createOscillator(), g = ctx.createGain(), p = panner(pan + Math.random() * 0.2 - 0.1);
      o.frequency.value = 4100 + Math.random() * 900; g.gain.value = 0;
      o.connect(g); g.connect(p); p.connect(out); o.start();
      return { o, g, lvl: 0.15 + Math.random() * 0.12, next: ctx.currentTime + 0.1 + Math.random() * 0.6, period: 0.32 + Math.random() * 0.3, pulses: 3 + rnd(3), gap: 0.026 + Math.random() * 0.012 };
    });
    const plan = () => {   // se programa 1,5 s por delante: así no se corta aunque la pestaña vaya lenta
      const horizon = ctx.currentTime + 1.5;
      for (const c of crickets) while (c.next < horizon) {
        const pause = Math.random() < 0.06;
        if (!pause) for (let k = 0; k < c.pulses; k++) {
          const t = c.next + k * c.gap;
          c.g.gain.setValueAtTime(0, t); c.g.gain.linearRampToValueAtTime(c.lvl, t + 0.004);
          c.g.gain.setValueAtTime(c.lvl, t + 0.011); c.g.gain.linearRampToValueAtTime(0, t + 0.017);
        }
        c.next += c.period * (0.96 + Math.random() * 0.08) + (pause ? 1 + Math.random() * 2.5 : 0);
      }
    };
    plan(); const iv = setInterval(plan, 250);
    return { out, stop() { clearInterval(iv); night.stop(); crickets.forEach(c => c.o.stop()); } };
  },
  cuenco() {   // cuenco tibetano: un golpe cada 11–20 s que se apaga despacio
    const out = ctx.createGain(); out.gain.value = 1.8;
    let timer;
    const strike = () => {
      const t = ctx.currentTime + 0.05, f0 = [196, 220, 246.94, 261.63][rnd(4)] * (0.995 + Math.random() * 0.01);
      for (const [ratio, amp, decay] of [[1, 1, 16], [2.72, 0.5, 11], [5.2, 0.25, 7], [8.4, 0.12, 4.5], [12.2, 0.05, 2.5]]) {
        for (const side of [-1, 1]) {   // dos tonos casi iguales: el «ua-ua» del cuenco
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.frequency.value = f0 * ratio + side * (0.3 + Math.random() * 0.9);
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(amp * 0.1, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
          o.connect(g); g.connect(out); o.start(t); o.stop(t + decay + 0.1);
        }
      }
      const n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();   // el golpe de la maza
      n.buffer = noiseW8; bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 1.5;
      ng.gain.setValueAtTime(0.12, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      n.connect(bp); bp.connect(ng); ng.connect(out); n.start(t, Math.random() * 7, 0.08);
      timer = setTimeout(strike, 11000 + Math.random() * 9000);
    };
    strike();
    return { out, stop() { clearTimeout(timer); } };
  },
  blanco() {
    const out = ctx.createGain(), s = loopSrc(noiseW8), lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 15000; out.gain.value = 0.22; s.connect(lp); lp.connect(out);
    return { out, stop() { s.stop(); } };
  },
  rosa() {
    const out = ctx.createGain(), s = loopSrc(noiseP); out.gain.value = 0.42; s.connect(out);
    return { out, stop() { s.stop(); } };
  },
  marron() {
    const out = ctx.createGain(), s = loopSrc(noiseR); out.gain.value = 0.6; s.connect(out);
    return { out, stop() { s.stop(); } };
  }
};
const NAMES = [['lluvia', '🌧️ Lluvia'], ['truenos', '⛈️ Truenos'], ['mar', '🌊 Mar'], ['viento', '🍃 Viento'], ['fuego', '🔥 Fuego'],
  ['pajaros', '🐦 Pájaros'], ['grillos', '🦗 Grillos'], ['cuenco', '🔔 Cuenco'],
  '|Ruido', ['blanco', 'Blanco'], ['rosa', 'Rosa'], ['marron', 'Marrón']];
const box = document.getElementById('sounds'), vol = box.querySelector('.vol');
NAMES.forEach(item => {
  if (typeof item === 'string') { const s = document.createElement('span'); s.className = 'grp'; s.textContent = item.slice(1); box.insertBefore(s, vol); return; }
  const [k, label] = item;
  const b = document.createElement('button'); b.className = 'pill'; b.type = 'button'; b.textContent = label; b.setAttribute('aria-pressed', 'false');
  b.onclick = async () => {
    audio(); if (ctx.state === 'suspended') await ctx.resume();
    if (tracks[k]) {
      const t = tracks[k]; delete tracks[k];
      t.out.gain.setTargetAtTime(0, ctx.currentTime, 0.2); setTimeout(() => { t.stop(); t.out.disconnect(); }, 900);
      b.classList.remove('on'); b.setAttribute('aria-pressed', 'false');
    } else {
      const t = MAKERS[k](); const target = t.out.gain.value; t.out.gain.value = 0;
      t.out.connect(master); t.out.gain.setTargetAtTime(target, ctx.currentTime, 0.4); tracks[k] = t;
      b.classList.add('on'); b.setAttribute('aria-pressed', 'true');
    }
  };
  box.insertBefore(b, vol);
});
document.getElementById('vol').oninput = e => { if (master) master.gain.setTargetAtTime(+e.target.value, ctx.currentTime, 0.05); };

// ---------- Los dos gatos pixelados: uno naranja y uno negro ----------
// Nombres opcionales en el enlace: rincon.html#gatos=Naranja,Negro  (primero el naranja, luego el negro)
const HP = new URLSearchParams(location.hash.slice(1));
const CAT_NAMES = (HP.get('gatos') || '').split(',').map(t => t.trim()).filter(Boolean);
const DARK = matchMedia('(prefers-color-scheme: dark)');
const F = {
  walk1: ['..........d..d', 'd........ooooo', 'd........okoko', 'od.......ooopo', '.od.oooooooooo', '..doooooooooo.', '...oooooooooo.', '...oowwwwwwoo.', '...o.o....o.o.', '...d.d....d.d.'],
  walk2: ['..........d..d', 'd........ooooo', 'd........okoko', 'od.......ooopo', '.od.oooooooooo', '..doooooooooo.', '...oooooooooo.', '...oowwwwwwoo.', '....o.o..o.o..', '....d.d..d.d..'],
  sit:   ['..........d..d', '.........ooooo', '.........okoko', '.........ooopo', '........oooooo', '.......oooooo.', '......oowwwoo.', '......oowwwoo.', '..ddd.ooooooo.', '....dddodddod.'],
  sleep: ['..............', '..............', '..............', '..........d..d', '.........ooooo', '.........ododo', '...ooooooooooo', '..oooowwwwoooo', '..oooooooooooo', 'dddddddddddddd']
};
const S = 4, CW = 14 * S, CH = 10 * S;
const cats = [
  { name: CAT_NAMES[0] || '', pal: { o: '#e89b4f', d: '#6b3f1d', k: '#1b1b1b', p: '#f29bb0', w: '#fff4e6' }, speed: 22, x: 20, dir: 1 },
  // negro: ojos ámbar y un borde suave en modo oscuro para que no desaparezca en el fondo
  { name: CAT_NAMES[1] || '', pal: { o: '#2b2b30', d: '#121214', k: '#e8c547', p: '#d98a9c', w: '#3d3d44' }, speed: 18, x: 200, dir: -1, halo: true }
].map(c => Object.assign(c, { state: 'walk', until: 0, frame: 0, jump: 0, t0: Math.random() * 1000 }));
const cv = document.getElementById('cat'), g = cv.getContext('2d');
let W = 300, parts = [], meetUntil = 0, nextMeet = 0;
if (cats[0].name || cats[1].name) {
  const n = cats.map(c => c.name).filter(Boolean);
  document.getElementById('cathint').textContent = n.join(' y ') + ' · tócalos';
  cv.setAttribute('aria-label', 'Dos gatos pixelados: ' + n.join(' y ') + '. Tócalos.');
}
function resize() {
  W = Math.max(160, cv.clientWidth); cv.width = W * devicePixelRatio; cv.height = 64 * devicePixelRatio;
  g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); g.imageSmoothingEnabled = false;
  cats.forEach(c => { c.x = Math.min(Math.max(2, c.x), W - CW - 2); });
}
function draw(spr, pal, px, py, flip, halo) {
  const cell = (r, c, color, ox, oy) => { const cc = flip ? spr[r].length - 1 - c : c; g.fillStyle = color; g.fillRect(Math.round(px + cc * S + ox), Math.round(py + r * S + oy), S, S); };
  if (halo && DARK.matches) {
    for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]])
      for (let r = 0; r < spr.length; r++) for (let c = 0; c < spr[r].length; c++) if (spr[r][c] !== '.') cell(r, c, 'rgba(255,255,255,0.3)', ox, oy);
  }
  for (let r = 0; r < spr.length; r++) for (let c = 0; c < spr[r].length; c++) { const ch = spr[r][c]; if (ch !== '.') cell(r, c, pal[ch], 0, 0); }
}
function pick(c, now) {
  const r = Math.random();
  if (c.state === 'sleep') c.state = r < 0.5 ? 'sit' : 'walk';
  else c.state = r < 0.55 ? 'walk' : r < 0.8 ? 'sit' : 'sleep';
  if (c.state === 'walk' && Math.random() < 0.4) c.dir = -c.dir;
  c.until = now + (c.state === 'sleep' ? 9000 + Math.random() * 9000 : 2500 + Math.random() * 5000);
}
function heart(x, y) { parts.push({ t: 'h', x, y, vy: -18, life: 1.4 }); }
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const [a, b] = cats;
  // Si se cruzan caminando, a veces se paran a saludarse
  if (now > nextMeet && a.state === 'walk' && b.state === 'walk' && Math.abs(a.x - b.x) < CW * 0.8) {
    nextMeet = now + 12000;
    if (Math.random() < 0.6) {
      meetUntil = now + 2600;
      const left = a.x < b.x ? a : b, right = left === a ? b : a;
      left.dir = 1; right.dir = -1; left.state = right.state = 'sit'; left.until = right.until = meetUntil;
      if (right.x - left.x < CW * 0.55) { const mid = (left.x + right.x) / 2; left.x = Math.max(2, mid - CW * 0.3); right.x = Math.min(W - CW - 2, mid + CW * 0.3); }
      heart((left.x + right.x) / 2 + CW / 2 - 4, 64 - CH - 6);
    }
  }
  for (const c of cats) {
    if (now > c.until) pick(c, now);
    if (c.state === 'walk') {
      c.x += c.dir * c.speed * dt;
      if (c.x < 2) { c.x = 2; c.dir = 1; } if (c.x > W - CW - 2) { c.x = W - CW - 2; c.dir = -1; }
      c.frame = Math.floor((now + c.t0) / 220) % 2;
    }
    if (c.jump > 0) c.jump = Math.max(0, c.jump - dt * 2.2);
    if (c.state === 'sleep' && Math.random() < dt * 0.9) parts.push({ t: 'z', x: c.x + (c.dir > 0 ? CW - 6 : 6), y: 64 - CH, vy: -10, life: 2.2 });
  }
  g.clearRect(0, 0, W, 64);
  for (const c of [b, a]) {   // el negro detrás, el naranja delante
    const jy = c.jump > 0 ? -Math.sin(c.jump * Math.PI) * 18 : 0;
    const spr = c.state === 'walk' ? (c.frame ? F.walk2 : F.walk1) : c.state === 'sit' ? F.sit : F.sleep;
    draw(spr, c.pal, c.x, 64 - CH - 2 + jy, c.dir < 0, c.halo);
  }
  parts = parts.filter(p => (p.life -= dt) > 0);
  const ink = getComputedStyle(document.body).color;
  for (const p of parts) {
    p.y += p.vy * dt; p.x += (p.t === 'z' ? 6 : 0) * dt;
    g.globalAlpha = Math.min(1, p.life);
    if (p.t === 'n') { g.fillStyle = ink; g.font = '600 11px ui-sans-serif, system-ui, sans-serif'; g.fillText(p.text, p.x, p.y); }
    else { g.fillStyle = p.t === 'z' ? ink : '#e5484d'; g.font = p.t === 'z' ? 'bold 11px ui-monospace, monospace' : '14px sans-serif'; g.fillText(p.t === 'z' ? 'z' : '♥', p.x, p.y); }
    g.globalAlpha = 1;
  }
  requestAnimationFrame(loop);
}
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, now = performance.now();
  document.getElementById('cathint').classList.add('gone');   // la pista sobra después del primer toque
  // el de delante (naranja) tiene prioridad si están encima el uno del otro
  const hit = cats.find(c => mx > c.x - 8 && mx < c.x + CW + 8);
  if (hit) {
    if (hit.state === 'sleep' || now < meetUntil) { hit.state = 'sit'; hit.until = now + 3000; }
    hit.jump = 1; heart(hit.x + CW / 2 - 4, 64 - CH - 4);
    if (hit.name) {   // el nombre, al lado de la cabeza (a la izquierda si no cabe a la derecha)
      g.font = '600 11px ui-sans-serif, system-ui, sans-serif';
      const tw = g.measureText(hit.name).width, right = hit.x + CW + 4 + tw < W - 2;
      parts.push({ t: 'n', text: hit.name, x: right ? hit.x + CW + 4 : hit.x - 4 - tw, y: 64 - CH + 6, vy: -5, life: 1.8 });
    }
  } else {
    const c = cats.reduce((p, q) => Math.abs(q.x + CW / 2 - mx) < Math.abs(p.x + CW / 2 - mx) ? q : p);
    c.dir = mx > c.x ? 1 : -1; c.state = 'walk'; c.until = now + 3000;
  }
});
window.addEventListener('resize', resize);
resize(); cats[1].x = Math.max(2, Math.min(W - CW - 2, W * 0.62));
cats.forEach(c => { pick(c, performance.now()); c.state = 'walk'; });
requestAnimationFrame(loop);
</script>
</body>
</html>
