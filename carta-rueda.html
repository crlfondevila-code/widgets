<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta natal · rueda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Marcellus&family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&display=swap">
<style>
  :root {
    --bg: #ECEEF3;
    --surface: #F8F9FB;
    --ink: #1A2030;
    --muted: #5A6377;
    --rule: #C9CFDA;
    --faint: #DFE3EA;
    --transit: #2A54C6;
    --harm: #1F7D6C;
    --tens: #BC3D35;
    --conj: #8A6810;
    --fire: rgba(205, 85, 55, .15);
    --earth: rgba(105, 130, 50, .16);
    --air: rgba(200, 160, 35, .18);
    --water: rgba(55, 105, 200, .15);
    --display: "Marcellus", "Cormorant Garamond", Georgia, serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --glyph: "Noto Sans Symbols", "Noto Sans Symbols 2", "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0F121A; --surface: #161A24; --ink: #E3E6EE; --muted: #98A0B3; --rule: #2C3344; --faint: #1E2331;
      --transit: #8AA8FF; --harm: #52C3AD; --tens: #F07D72; --conj: #D8B14E;
      --fire: rgba(230, 110, 80, .22); --earth: rgba(140, 170, 80, .20); --air: rgba(230, 190, 70, .20); --water: rgba(90, 140, 240, .22);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F121A; --surface: #161A24; --ink: #E3E6EE; --muted: #98A0B3; --rule: #2C3344; --faint: #1E2331;
    --transit: #8AA8FF; --harm: #52C3AD; --tens: #F07D72; --conj: #D8B14E;
    --fire: rgba(230, 110, 80, .22); --earth: rgba(140, 170, 80, .20); --air: rgba(230, 190, 70, .20); --water: rgba(90, 140, 240, .22);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); }
  .gl { font-family: var(--glyph); font-weight: 400; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px; }
  .bar .grow { flex: 1 1 auto; }
  input[type="datetime-local"] { font: 13px var(--mono); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 6px; min-width: 0; max-width: 100%; }
  button { font: 500 12.5px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 8px; cursor: pointer; line-height: 1.3; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--transit); outline-offset: 2px; }
  button.arrow { font-size: 16px; padding: 1px 9px; }
  button.now { background: var(--transit); color: var(--surface); border-color: var(--transit); }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; border-radius: 0; background: transparent; }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  .err { margin: 16px; padding: 16px; border: 1px solid var(--tens); color: var(--tens); border-radius: 8px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  main { height: 100%; display: flex; flex-direction: column; }
  .wheel { flex: 1 1 auto; min-height: 0; margin: 0; padding: 0 6px; display: flex; }
  .wheel svg { width: 100%; height: 100%; display: block; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; margin: 0; padding: 4px 8px 8px; font-size: 12px; color: var(--muted); }
  .legend > span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  @media (max-height: 460px), (max-width: 340px) { .legend { display: none; } }
  @media (max-width: 420px) { .bar .grow { display: none; } }
  /* SVG */
  .z-ring { stroke: var(--rule); stroke-width: 1; }
  .ring { fill: none; stroke: var(--rule); stroke-width: 1; }
  .ring-strong { fill: none; stroke: var(--muted); stroke-width: 1.2; }
  .tick { stroke: var(--muted); stroke-width: .8; }
  .cusp { stroke: var(--rule); stroke-width: 1; }
  .axis { stroke: var(--ink); stroke-width: 2; }
  .s-sign { font-family: var(--glyph); font-size: 34px; fill: var(--ink); }
  .s-natal { font-family: var(--glyph); font-size: 36px; fill: var(--ink); }
  .s-transit { font-family: var(--glyph); font-size: 32px; fill: var(--transit); }
  .s-deg { font-family: var(--mono); font-size: 18px; fill: var(--muted); }
  .s-degt { font-family: var(--mono); font-size: 17px; fill: var(--transit); }
  .s-house { font-family: var(--mono); font-size: 17px; fill: var(--muted); }
  .s-axis { font-family: var(--body); font-size: 19px; font-weight: 600; fill: var(--ink); }
  .lead { stroke: var(--muted); stroke-width: .8; }
  .lead-t { stroke: var(--transit); stroke-width: .8; opacity: .8; }
  .dot-n { fill: var(--ink); }
  .dot-t { fill: var(--surface); stroke: var(--transit); stroke-width: 1.5; }
  .inner { fill: var(--surface); }
  @media (prefers-reduced-motion: no-preference) { .wheel svg .aspline { transition: opacity .2s; } }
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style></head><body>
<main>
  <nav class="bar" aria-label="Fecha de los tránsitos">
    <button type="button" class="arrow" data-step="-1" aria-label="Retroceder">‹</button>
    <label class="sr" for="when">Tránsitos para</label>
    <input type="datetime-local" id="when" step="60">
    <button type="button" class="arrow" data-step="1" aria-label="Avanzar">›</button>
    <div class="seg" role="group" aria-label="Tamaño del paso">
      <button type="button" data-unit="d" aria-pressed="true">día</button><button type="button" data-unit="m" aria-pressed="false">mes</button><button type="button" data-unit="y" aria-pressed="false">año</button>
    </div>
    <button type="button" class="now" id="now">Ahora</button>
    <span class="grow"></span>
    <div class="seg" role="group" aria-label="Líneas del centro">
      <button type="button" data-mode="t" aria-pressed="true" title="Tránsitos a tu carta">Tránsitos</button><button type="button" data-mode="n" aria-pressed="false" title="Aspectos natales">Natal</button>
    </div>
  </nav>
  <figure class="wheel">
    <svg id="wheel" viewBox="0 0 1000 1000" role="img" aria-label="Rueda natal con los tránsitos de la fecha elegida"></svg>
  </figure>
  <p class="legend">
    <span><span class="gl">☉&#xFE0E;</span> dentro: natal</span>
    <span style="color:var(--transit)"><span class="gl">☉&#xFE0E;</span> fuera: la fecha</span>
    <span><i class="sw" style="background:var(--tens)"></i>tensos</span>
    <span><i class="sw" style="background:var(--harm)"></i>armónicos</span>
    <span><i class="sw" style="background:var(--conj)"></i>conjunción</span>
  </p>
</main>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script src="carta-core.js"></script>
<script>
(function () {
  const VS = '\uFE0E';
  const $ = id => document.getElementById(id);
  const BIRTH = window.CartaBirth && CartaBirth.get();
  if (!BIRTH) { if (window.CartaBirth) CartaBirth.showSetup(document.querySelector('main')); return; }
  const PL = {
    sun: ['Sol', '☉'], moon: ['Luna', '☽'], mercury: ['Mercurio', '☿'], venus: ['Venus', '♀'], mars: ['Marte', '♂'],
    jupiter: ['Júpiter', '♃'], saturn: ['Saturno', '♄'], uranus: ['Urano', '♅'], neptune: ['Neptuno', '♆'],
    pluto: ['Plutón', '♇'], node: ['Nodo norte', '☊'], asc: ['Ascendente', 'AC'], mc: ['Medio Cielo', 'MC']
  };
  const ORDER = ['sun', 'moon', 'mercury', 'venus', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune', 'pluto', 'node'];
  const SIGNS = [
    ['Aries', '♈', 'fire'], ['Tauro', '♉', 'earth'], ['Géminis', '♊', 'air'], ['Cáncer', '♋', 'water'],
    ['Leo', '♌', 'fire'], ['Virgo', '♍', 'earth'], ['Libra', '♎', 'air'], ['Escorpio', '♏', 'water'],
    ['Sagitario', '♐', 'fire'], ['Capricornio', '♑', 'earth'], ['Acuario', '♒', 'air'], ['Piscis', '♓', 'water']
  ];
  const ASPECTS = [
    { a: 0, n: 'conjunción', g: '☌', k: 'conj', tOrb: 3, nOrb: 8 },
    { a: 60, n: 'sextil', g: '⚹', k: 'harm', tOrb: 2, nOrb: 6 },
    { a: 90, n: 'cuadratura', g: '□', k: 'tens', tOrb: 3, nOrb: 8 },
    { a: 120, n: 'trígono', g: '△', k: 'harm', tOrb: 3, nOrb: 8 },
    { a: 180, n: 'oposición', g: '☍', k: 'tens', tOrb: 3, nOrb: 8 }
  ];
  const COLOR = { conj: 'var(--conj)', harm: 'var(--harm)', tens: 'var(--tens)' };

  if (!window.Astronomy || !window.AstroCore) {
    document.querySelector('main').innerHTML = '<p class="err">No se ha podido cargar la librería de cálculo astronómico. Comprueba la conexión y vuelve a abrir la página.</p>';
    return;
  }
  const C = window.AstroCore, norm = C.norm;

  const natal = C.positions(BIRTH.date);
  const H = C.houses(BIRTH.date, BIRTH.lat, BIRTH.lon);
  natal.asc = { lon: H.asc, speed: 0, retro: false };
  natal.mc = { lon: H.mc, speed: 0, retro: false };
  const ASC = H.asc;

  const signOf = lon => SIGNS[Math.floor(norm(lon) / 30)];
  function dm(lon) {
    const x = norm(lon) % 30;
    let d = Math.floor(x), m = Math.round((x - d) * 60);
    if (m === 60) { d += 1; m = 0; }
    return { d, m, txt: `${d}°${String(m).padStart(2, '0')}′` };
  }
  const orbTxt = o => { const d = Math.floor(o), m = Math.round((o - d) * 60); return m === 60 ? `${d + 1}°00′` : `${d}°${String(m).padStart(2, '0')}′`; };
  const glyph = k => (PL[k][1].length === 1 ? PL[k][1] + VS : PL[k][1]);
  const sGlyph = s => s[1] + VS;
  const sep = (a, b) => { const d = norm(a - b); return d > 180 ? 360 - d : d; };

  if ($('cusps')) $('cusps').innerHTML = H.cusps.slice(1).map((c, i) => {
    const s = signOf(c);
    return `<div><span class="k">Casa ${i + 1}</span> <span class="gl">${sGlyph(s)}</span> ${s[0]} ${dm(c).txt}</div>`;
  }).join('');

  function transitAspects(tr, includeMoon) {
    const out = [];
    for (const tk of ORDER) {
      if (!includeMoon && tk === 'moon') continue;
      const t = tr[tk];
      for (const nk of [...ORDER, 'asc', 'mc']) {
        const n = natal[nk].lon, s = sep(t.lon, n);
        for (const A of ASPECTS) {
          if (tk === 'node' && A.a !== 0 && A.a !== 180) continue;
          const orb = Math.abs(s - A.a);
          if (orb <= A.tOrb) {
            const applying = Math.abs(sep(t.lon + t.speed * 0.25, n) - A.a) < orb;
            out.push({ tk, nk, A, orb, applying, tLon: t.lon, nLon: n });
          }
        }
      }
    }
    return out.sort((x, y) => x.orb - y.orb);
  }
  const NATAL_ASP = (() => {
    const out = [], keys = ORDER.filter(k => k !== 'node');
    for (let i = 0; i < keys.length; i++) for (let j = i + 1; j < keys.length; j++) {
      const a = natal[keys[i]].lon, b = natal[keys[j]].lon, s = sep(a, b);
      for (const A of ASPECTS) { const orb = Math.abs(s - A.a); if (orb <= A.nOrb) out.push({ A, orb, aLon: a, bLon: b }); }
    }
    return out;
  })();

  // ---------- rueda ----------
  const CX = 500, CY = 500;
  const R = { out: 492, zOut: 402, zIn: 346, hIn: 316, asp: 214 };
  const D2R = Math.PI / 180;
  const pt = (lon, r) => { const f = (lon - ASC) * D2R; return [CX - r * Math.cos(f), CY + r * Math.sin(f)]; };
  const f1 = n => n.toFixed(1);
  const line = (l1, r1, l2, r2, cls, extra = '') => { const [x1, y1] = pt(l1, r1), [x2, y2] = pt(l2, r2); return `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" class="${cls}" ${extra}/>`; };
  const text = (lon, r, s, cls, extra = '') => { const [x, y] = pt(lon, r); return `<text x="${f1(x)}" y="${f1(y)}" class="${cls}" text-anchor="middle" dominant-baseline="central" ${extra}>${s}</text>`; };
  function sector(a, b, r1, r2, fill) {
    const [x1, y1] = pt(a, r2), [x2, y2] = pt(b, r2), [x3, y3] = pt(b, r1), [x4, y4] = pt(a, r1);
    return `<path d="M${f1(x1)} ${f1(y1)} A${r2} ${r2} 0 0 0 ${f1(x2)} ${f1(y2)} L${f1(x3)} ${f1(y3)} A${r1} ${r1} 0 0 1 ${f1(x4)} ${f1(y4)} Z" fill="${fill}" class="z-ring"/>`;
  }
  function spread(items, minSep) {
    const arr = items.map(o => ({ ...o, disp: o.lon })).sort((a, b) => a.lon - b.lon);
    for (let pass = 0; pass < 200; pass++) {
      let moved = false;
      for (let i = 0; i < arr.length; i++) {
        const a = arr[i], b = arr[(i + 1) % arr.length], gap = norm(b.disp - a.disp);
        if (gap < minSep) { const push = (minSep - gap) / 2 + 0.01; a.disp = norm(a.disp - push); b.disp = norm(b.disp + push); moved = true; }
      }
      if (!moved) break;
    }
    return arr;
  }
  function drawWheel(tr, tAsps, mode) {
    const wheel = $('wheel'); if (!wheel) return;
    let s = `<circle cx="${CX}" cy="${CY}" r="${R.out}" class="ring" fill="var(--surface)"/>`;
    SIGNS.forEach((sg, i) => { s += sector(i * 30, i * 30 + 30, R.zIn, R.zOut, `var(--${sg[2]})`); });
    for (let d = 0; d < 360; d++) { const len = d % 10 === 0 ? 12 : d % 5 === 0 ? 8 : 4; s += line(d, R.zIn, d, R.zIn + len, 'tick'); }
    SIGNS.forEach((sg, i) => { s += text(i * 30 + 15, (R.zIn + R.zOut) / 2 + 4, sGlyph(sg), 's-sign', `aria-label="${sg[0]}"`); });
    s += `<circle cx="${CX}" cy="${CY}" r="${R.zOut}" class="ring-strong"/><circle cx="${CX}" cy="${CY}" r="${R.zIn}" class="ring-strong"/>`;
    s += `<circle cx="${CX}" cy="${CY}" r="${R.hIn}" class="ring"/><circle cx="${CX}" cy="${CY}" r="${R.asp}" class="ring inner"/>`;
    for (let h = 1; h <= 12; h++) {
      const c = H.cusps[h], nx = H.cusps[h === 12 ? 1 : h + 1];
      s += line(c, R.asp, c, R.zIn, [1, 4, 7, 10].includes(h) ? 'axis' : 'cusp');
      s += text(c + norm(nx - c) / 2, (R.hIn + R.zIn) / 2, h, 's-house');
    }
    [['AC', H.cusps[1]], ['FC', H.cusps[4]], ['DC', H.cusps[7]], ['MC', H.cusps[10]]].forEach(([lab, l]) => { s += text(l + 6, R.asp - 20, lab, 's-axis'); });
    if (mode === 't') {
      for (const x of tAsps) {
        const col = COLOR[x.A.k], w = (1 + 2.2 * (1 - x.orb / x.A.tOrb)).toFixed(2);
        if (x.A.a === 0) { const [cx, cy] = pt(x.nLon, R.asp); s += `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="9" fill="none" stroke="${col}" stroke-width="${w}"/>`; }
        else s += line(x.tLon, R.asp, x.nLon, R.asp, 'aspline', `stroke="${col}" stroke-width="${w}" opacity=".85"`);
      }
    } else {
      for (const x of NATAL_ASP) {
        if (x.A.a === 0) continue;
        s += line(x.aLon, R.asp, x.bLon, R.asp, 'aspline', `stroke="${COLOR[x.A.k]}" stroke-width="${(0.8 + 1.6 * (1 - x.orb / x.A.nOrb)).toFixed(2)}" opacity=".8"`);
      }
    }
    for (const it of spread(ORDER.map(k => ({ k, lon: natal[k].lon })), 8.2)) {
      s += line(it.lon, R.hIn, it.lon, R.hIn - 9, 'tick');
      if (Math.abs(norm(it.disp - it.lon + 180) - 180) > 0.4) s += line(it.lon, R.hIn - 9, it.disp, R.hIn - 16, 'lead');
      s += text(it.disp, R.hIn - 36, glyph(it.k), 's-natal', `aria-label="${PL[it.k][0]} natal"`);
      s += text(it.disp, R.hIn - 66, `${dm(it.lon).d}°`, 's-deg');
      const [x, y] = pt(it.lon, R.asp); s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="3.2" class="dot-n"/>`;
    }
    for (const it of spread(ORDER.map(k => ({ k, lon: tr[k].lon })), 7.4)) {
      s += line(it.lon, R.zOut, it.lon, R.zOut + 10, 'lead-t');
      if (Math.abs(norm(it.disp - it.lon + 180) - 180) > 0.4) s += line(it.lon, R.zOut + 10, it.disp, R.zOut + 18, 'lead-t');
      s += text(it.disp, R.zOut + 38, glyph(it.k), 's-transit', `aria-label="${PL[it.k][0]} en tránsito"`);
      s += text(it.disp, R.zOut + 70, `${dm(it.lon).d}°${tr[it.k].retro ? '℞' : ''}`, 's-degt');
      const [x, y] = pt(it.lon, R.asp); s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="3.6" class="dot-t"/>`;
    }
    wheel.innerHTML = `<title>Rueda natal con los tránsitos de la fecha elegida</title>` + s;
  }

  // ---------- lista y tabla ----------
  function renderList(tr, asps) {
    const ul = $('aspList'); if (!ul) return;
    if ($('aspCount')) $('aspCount').textContent = asps.length;
    if (!asps.length) { ul.innerHTML = '<li class="empty">No hay tránsitos dentro del orbe en esta fecha.</li>'; return; }
    ul.innerHTML = asps.map(x => {
      const t = tr[x.tk], ts = signOf(t.lon);
      const target = x.nk === 'asc' ? 'Ascendente' : x.nk === 'mc' ? 'Medio Cielo' : PL[x.nk][0];
      const slow = ['jupiter', 'saturn', 'uranus', 'neptune', 'pluto'].includes(x.tk);
      return `<li style="--c:${COLOR[x.A.k]}"${slow ? ' class="slow"' : ''}>
        <div class="line"><span class="t"><span class="gl">${glyph(x.tk)}</span> ${PL[x.tk][0]}${t.retro ? ' ℞' : ''}</span>
          <span class="a"><span class="gl">${x.A.g}${VS}</span> ${x.A.n}</span>
          <span class="n">${x.nk === 'asc' || x.nk === 'mc' ? '' : `<span class="gl">${glyph(x.nk)}</span> `}${target}</span></div>
        <div class="meta">${orbTxt(x.orb)} · ${x.applying ? 'se acerca' : 'se aleja'} · en ${ts[0]} ${dm(t.lon).txt}, casa ${C.houseOf(t.lon, H.cusps)}${slow ? ' · lento' : ''}</div>
      </li>`;
    }).join('');
  }
  function renderTable(tr) {
    const tb = $('posBody'); if (!tb) return;
    tb.innerHTML = [...ORDER, 'asc', 'mc'].map(k => {
      const n = natal[k], ns = signOf(n.lon);
      const nh = k === 'asc' ? 1 : k === 'mc' ? 10 : C.houseOf(n.lon, H.cusps);
      let tc = '<td class="tcol">—</td><td class="tcol c">—</td>';
      if (tr[k]) {
        const t = tr[k], ts = signOf(t.lon);
        tc = `<td class="tcol"><span class="gl">${sGlyph(ts)}</span> <span class="sn">${ts[0]} </span>${dm(t.lon).txt}${t.retro ? '<span class="rx">℞</span>' : ''}</td><td class="tcol c">${C.houseOf(t.lon, H.cusps)}</td>`;
      }
      return `<tr><th scope="row"><span class="gl">${glyph(k)}</span><span class="pn"> ${PL[k][0]}</span></th><td><span class="gl">${sGlyph(ns)}</span> <span class="sn">${ns[0]} </span>${dm(n.lon).txt}</td><td class="c">${nh}</td>${tc}</tr>`;
    }).join('');
  }

  // ---------- estado ----------
  const input = $('when'), moonBox = $('moon');
  let when = new Date(), mode = 't', unit = 'd';
  const pad = n => String(n).padStart(2, '0');
  const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

  function update() {
    const tr = C.positions(when);
    const asps = transitAspects(tr, moonBox ? moonBox.checked : true);
    drawWheel(tr, asps, mode);
    renderList(tr, asps);
    renderTable(tr);
    input.value = toLocalInput(when);
  }
  input.addEventListener('change', () => { if (input.value) { const d = new Date(input.value); if (!isNaN(d)) { when = d; update(); } } });
  document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
    const n = +b.dataset.step, d = new Date(when);
    if (unit === 'd') d.setDate(d.getDate() + n); else if (unit === 'm') d.setMonth(d.getMonth() + n); else d.setFullYear(d.getFullYear() + n);
    when = d; update();
  }));
  document.querySelectorAll('[data-unit]').forEach(b => b.addEventListener('click', () => {
    unit = b.dataset.unit;
    document.querySelectorAll('[data-unit]').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b));
    update();
  }));
  $('now').addEventListener('click', () => { when = new Date(); update(); });
  if (moonBox) moonBox.addEventListener('change', update);
  update();
})();
</script>
</body></html>
