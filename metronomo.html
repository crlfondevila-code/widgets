<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrónomo</title>
<style>
:root { --bg:#fff; --card:#f7f7f5; --text:#37352f; --muted:#787774; --line:#e9e9e7; --on:#37352f; --onText:#fff; --acc:#2e7d4f; }
@media (prefers-color-scheme: dark) { :root { --bg:#191919; --card:#232323; --text:#e8e7e4; --muted:#9b9a97; --line:#303030; --on:#e8e7e4; --onText:#191919; --acc:#6fbf8e; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.4 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.wrap { padding: 12px; display: grid; gap: 12px; max-width: 520px; margin: 0 auto; }
.stage { background: var(--card); border-radius: 12px; padding: 14px; text-align: center; position: relative; overflow: hidden; }
.flash { position: absolute; inset: 0; background: var(--acc); opacity: 0; pointer-events: none; }
.flash.go { animation: fl .18s ease-out; }
@keyframes fl { from { opacity: .16; } to { opacity: 0; } }
.big { font: 600 72px/1 Georgia, "Iowan Old Style", "Palatino Linotype", serif; }
.name { color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; margin-top: 2px; }
.beats { display: flex; justify-content: center; gap: 8px; margin-top: 12px; min-height: 18px; flex-wrap: wrap; }
.beats button { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); background: none; padding: 0; cursor: pointer; opacity: .55; transition: background .05s, transform .05s; }
.beats button.acc { border-color: var(--text); opacity: .9; }
.beats button.mute { border-style: dashed; opacity: .3; }
.beats button.on { background: var(--acc); border-color: var(--acc); opacity: 1; transform: scale(1.25); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row.c { justify-content: center; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--card); }
.play { border: 0; background: var(--on); color: var(--onText); border-radius: 999px; padding: 11px 30px; font-weight: 600; font-size: 15px; cursor: pointer; min-width: 120px; }
input[type=range] { width: 100%; accent-color: var(--muted); }
select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 8px; }
.lab { color: var(--muted); font-size: 12px; }
.grow { flex: 1 1 130px; min-width: 110px; }
.hint { color: var(--muted); font-size: 12px; margin: 0; text-align: center; }
@media (prefers-reduced-motion: reduce) { .flash.go { animation: none; } .beats button { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="flash" id="flash"></div>
    <div class="big" id="big">90</div>
    <div class="name" id="tname">Andante</div>
    <div class="beats" id="beats"></div>
  </div>

  <input type="range" id="slider" min="30" max="260" value="90" aria-label="Tempo en pulsaciones por minuto">

  <div class="row c">
    <button class="btn" id="m5" type="button" aria-label="Bajar 5">−5</button>
    <button class="btn" id="m1" type="button" aria-label="Bajar 1">−1</button>
    <button class="play" id="play" type="button">▶ Empezar</button>
    <button class="btn" id="p1" type="button" aria-label="Subir 1">+1</button>
    <button class="btn" id="p5" type="button" aria-label="Subir 5">+5</button>
  </div>

  <div class="row">
    <span class="lab">Compás</span>
    <select id="bpb" aria-label="Pulsos por compás">
      <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option>
      <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="12">12</option>
    </select>
    <span class="lab">Subdivisión</span>
    <select id="sub" aria-label="Subdivisión">
      <option value="1">Negras</option><option value="2">Corcheas</option><option value="3">Tresillos</option><option value="4">Semicorcheas</option>
    </select>
    <button class="btn" id="tap" type="button" title="Toca al ritmo (tecla T)" style="margin-left:auto">Tap</button>
  </div>

  <div class="row">
    <span class="lab">Sonido</span>
    <select id="tone" aria-label="Sonido del clic"><option value="click">Clic</option><option value="wood">Madera</option><option value="beep">Pitido</option></select>
    <input class="grow" id="vol" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volumen">
  </div>
  <p class="hint">Toca un círculo para cambiarlo: normal → acento → silencio. Espacio: empezar/parar · ↑↓: tempo · T: tap.</p>
</div>
<script>
// Metrónomo. Se configura en el enlace, después de #:
//   #bpm=90  &c=4 (pulsos por compás)  &sub=1 (1 negras, 2 corcheas, 3 tresillos, 4 semicorcheas)
//   &sonido=click|wood|beep  &acentos=2,1,0,1 (2 acento, 1 normal, 0 silencio, un número por pulso)
(() => {
  const $ = id => document.getElementById(id);
  const P = new URLSearchParams(location.hash.slice(1));
  const LS = 'metronomo:v1';
  const saved = (() => { try { return JSON.parse(localStorage.getItem(LS) || 'null') || {}; } catch (e) { return {}; } })();
  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
  const st = {
    bpm: clamp(parseFloat(P.get('bpm') || saved.bpm) || 90, 30, 260),
    bpb: clamp(parseInt(P.get('c') || saved.bpb, 10) || 4, 1, 12),
    sub: clamp(parseInt(P.get('sub') || saved.sub, 10) || 1, 1, 4),
    tone: ['click', 'wood', 'beep'].includes(P.get('sonido') || saved.tone) ? (P.get('sonido') || saved.tone) : 'click',
    vol: isNaN(parseFloat(saved.vol)) ? 0.7 : clamp(parseFloat(saved.vol), 0, 1),
    pat: P.get('acentos') ? P.get('acentos').split(',').map(x => clamp(parseInt(x, 10) || 0, 0, 2)) : (Array.isArray(saved.pat) ? saved.pat : [])
  };
  const fixPat = () => { const p = []; for (let i = 0; i < st.bpb; i++) p.push(st.pat[i] != null ? st.pat[i] : (i === 0 ? 2 : 1)); st.pat = p; };
  const NAMES = [[40, 'Grave'], [60, 'Largo'], [66, 'Larghetto'], [76, 'Adagio'], [108, 'Andante'], [120, 'Moderato'], [156, 'Allegro'], [176, 'Vivace'], [200, 'Presto'], [999, 'Prestissimo']];
  const tname = bpm => NAMES.find(n => bpm < n[0])[1];

  let ctx = null, master = null, playing = false, timer = 0, raf = 0, nextTime = 0, beat = 0, subi = 0, queue = [];

  function audio() {
    if (ctx) return ctx;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = st.vol; master.connect(ctx.destination);
    return ctx;
  }
  function sound(t, level, sub) {   // level 2 acento, 1 normal; sub: subdivisión (más flojo)
    const o = ctx.createOscillator(), g = ctx.createGain();
    const base = level === 2 ? 1568 : 1046, v = sub ? 0.35 : level === 2 ? 1 : 0.7;
    if (st.tone === 'beep') { o.type = 'sine'; o.frequency.value = sub ? base * 0.75 : base * 0.5 * 1.0; var dur = 0.09; }
    else if (st.tone === 'wood') { o.type = 'square'; o.frequency.setValueAtTime(base * 0.8, t); o.frequency.exponentialRampToValueAtTime(base * 0.35, t + 0.03); var dur = 0.05; }
    else { o.type = 'triangle'; o.frequency.value = sub ? base * 0.8 : base; var dur = 0.05; }
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v * (st.tone === 'wood' ? 0.5 : 1), t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  function schedule() {
    const horizon = ctx.currentTime + 0.12;
    while (nextTime < horizon) {
      const lvl = st.pat[beat] != null ? st.pat[beat] : 1;
      if (subi === 0) { if (lvl > 0) sound(nextTime, lvl, false); }
      else sound(nextTime, 1, true);
      queue.push({ t: nextTime, beat, sub: subi, lvl });
      nextTime += 60 / st.bpm / st.sub;
      if (++subi >= st.sub) { subi = 0; beat = (beat + 1) % st.bpb; }
    }
  }
  function frame() {
    if (!playing) return;
    const now = ctx.currentTime - (ctx.outputLatency || 0);
    while (queue.length && queue[0].t <= now) {
      const e = queue.shift();
      if (e.sub === 0) { mark(e.beat); if (e.lvl > 0) pulse(); }
    }
    raf = requestAnimationFrame(frame);
  }
  const flashEl = $('flash');
  function pulse() { flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go'); }
  function mark(b) { [...$('beats').children].forEach((d, k) => d.classList.toggle('on', k === b)); }

  async function start() {
    audio(); if (ctx.state === 'suspended') await ctx.resume();
    playing = true; queue = []; beat = 0; subi = 0; nextTime = ctx.currentTime + 0.06;
    $('play').textContent = '■ Parar'; schedule(); timer = setInterval(schedule, 25); raf = requestAnimationFrame(frame);
  }
  function stop() { playing = false; clearInterval(timer); cancelAnimationFrame(raf); queue = []; mark(-1); $('play').textContent = '▶ Empezar'; }

  function drawBeats() {
    fixPat();
    const box = $('beats'); box.replaceChildren();
    st.pat.forEach((lvl, i) => {
      const b = document.createElement('button'); b.type = 'button';
      b.className = lvl === 2 ? 'acc' : lvl === 0 ? 'mute' : '';
      b.setAttribute('aria-label', 'Pulso ' + (i + 1) + ': ' + ['silencio', 'normal', 'acento'][lvl]);
      b.onclick = () => { st.pat[i] = (lvl + 1) % 3; drawBeats(); persist(); };   // 1 normal → 2 acento → 0 silencio → 1 normal
      box.append(b);
    });
  }
  function setBpm(v) { st.bpm = clamp(Math.round(v), 30, 260); $('big').textContent = st.bpm; $('tname').textContent = tname(st.bpm); $('slider').value = st.bpm; persist(); }
  $('slider').oninput = e => setBpm(+e.target.value);
  $('m1').onclick = () => setBpm(st.bpm - 1); $('p1').onclick = () => setBpm(st.bpm + 1);
  $('m5').onclick = () => setBpm(st.bpm - 5); $('p5').onclick = () => setBpm(st.bpm + 5);
  $('play').onclick = () => playing ? stop() : start();
  $('bpb').onchange = e => { st.bpb = +e.target.value; drawBeats(); beat = 0; persist(); };
  $('sub').onchange = e => { st.sub = +e.target.value; subi = 0; persist(); };
  $('tone').onchange = e => { st.tone = e.target.value; persist(); if (ctx) { sound(ctx.currentTime + 0.02, 2, false); } };
  $('vol').oninput = e => { st.vol = +e.target.value; if (master) master.gain.setTargetAtTime(st.vol, ctx.currentTime, 0.02); persist(); };

  let taps = [];
  function tap() {
    const n = performance.now();
    if (taps.length && n - taps[taps.length - 1] > 2200) taps = [];
    taps.push(n); if (taps.length > 6) taps.shift();
    if (taps.length >= 2) setBpm(60000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1)));
  }
  $('tap').onclick = tap;
  document.addEventListener('keydown', e => {
    if (/^(INPUT|SELECT)$/.test(e.target.tagName) && e.key !== ' ') return;
    if (e.target.tagName === 'BUTTON' && e.key === ' ') return;
    if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'ArrowUp' && e.target.tagName !== 'INPUT') { e.preventDefault(); setBpm(st.bpm + (e.shiftKey ? 5 : 1)); }
    else if (e.key === 'ArrowDown' && e.target.tagName !== 'INPUT') { e.preventDefault(); setBpm(st.bpm - (e.shiftKey ? 5 : 1)); }
    else if (e.key === 't' || e.key === 'T') tap();
  });

  let pt = null;
  function persist() {
    clearTimeout(pt);
    pt = setTimeout(() => {
      try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {}
      try { history.replaceState(null, '', '#' + new URLSearchParams({ bpm: st.bpm, c: st.bpb, sub: st.sub, sonido: st.tone, acentos: st.pat.join(',') }).toString()); } catch (e) {}
    }, 300);
  }

  $('bpb').value = st.bpb; $('sub').value = st.sub; $('tone').value = st.tone; $('vol').value = st.vol;
  drawBeats(); setBpm(st.bpm);
})();
</script>
</body>
</html>
